    held the line would go unpaid. Kings wore a circlet to remind them of the debt, but the
    Crown itself was the promise, and the promise was kept for four hundred years.

    At Hallowmere it broke. Not in battle — in a counting-house. The last king found the
    ledgers empty, the oath-fire cold, and eleven thousand soldiers on the northern line
    who had been promised a winter's wages he could not pay. He rode out to tell them
    himself. That much, at least, the chroniclers grant him.

    He did not come back, and neither did the Crown.`},{id:"unpaid",title:"The Unpaid",when:"Every night since",body:`What comes over the ridge is not a monster and never was. They are the ones who
    were owed.

    Ninety years is long enough that none of the original eleven thousand still walk, but
    the debt outlived them and the bands did not disband — they inherited. A grandson of a
    pikeman from the northern line still knows to the copper what his grandfather was
    promised. He comes to collect it from whoever holds a wall, because the crown that owed
    him is ash and a wall is the nearest thing to a king that remains.

    This is why they come back weaker after they win. A band that collects goes home a
    little squarer with the world. It is why they come back stronger after they lose:
    nothing sharpens a claim like being refused.`},{id:"wardens",title:"The Wardens",when:"Now",body:`No one appointed you. That office ended with the office that made it.

    What happened instead is that people who had nowhere else to go walked out to the
    frontier and started building, and the ones who built well enough that others sheltered
    behind them were called Wardens, first as a joke and then not.

    You have a hall, a wall you raised yourself, and a muster that eats whether or not it
    fights. Nobody is coming. That is the entire situation, and everything else in this
    game is what you decide to do about it.`},{id:"valor",title:"Valor, and why it cannot be bought",when:"The old currency",body:`Oath-coin was never minted. It was <i>witnessed</i> — struck at the moment a thing
    was done and worth exactly what the doing was worth. A merchant could not buy it, a king
    could not print it, and a thief could steal the disc but never the debt behind it.

    That is why the Reach still honours Valor when it honours nothing else. Every point in
    your treasury was cut the moment you held a wall, finished a study, or brought a column
    home. There is no forge that makes more.

    There are places in the world where you can buy a faster army. This is not one of them,
    and the reason is ninety years old.`},{id:"horns",title:"Why heroes answer",when:"The draft",body:`Heroes do not take contracts. They answer horns.

    When a hall grows enough to be worth defending, word travels, and riders turn up at the
    gate — usually three, rarely the three you were hoping for. You take one. The others ride
    on to someone else's gate, and you will meet them later on somebody else's wall.

    No Warden has ever assembled the roster they wanted. Every hall in the Reach is defended
    by a different accident, and the ones that last are the halls that learned to fight with
    who actually came.`},{id:"court",title:"The chair and the saddle",when:"On command",body:`A hero at your table changes how the whole hold runs — what it grows, how fast it
    drills, how hard it hits. A hero at the head of a column changes only that column, and
    changes it a great deal.

    They cannot do both. A voice at the table is a voice in the room, and a captain three
    days' ride out is three days' ride out. Every Warden learns this the same way: by
    sending their best adviser to burn a camp and discovering the harvest came in short.`},{id:"stars",title:"On stars",when:"Ascension",body:`The Reach marks a captain by what they have done, and it does the marking whether
    anyone is watching or not. Ride enough roads, burn enough camps, hold enough lines, and
    the name starts arriving before the person does.

    Nothing about this can be hurried, and nothing about it can be purchased, because there
    is no ledger — there is only the road behind them. A captain who has never left the hall
    is a captain nobody has heard of, however clever.`},{id:"realm",title:"The Reach",when:"Beyond your walls",body:`You are not the only one who walked out here.

    The Reach is what the frontier calls itself now — a scatter of halls that trade, argue,
    ally, and occasionally test each other's walls to see what is behind them. There is no
    capital. There is a great deal of opinion about where the capital ought to be.

    When holds fight here nothing is taken. A Warden who strips another Warden's granary has
    made the frontier one hall weaker against the thing that actually comes at night, and
    the Reach has long memories about that. What changes hands is reputation, which out here
    is the only currency above oath-coin.`},{id:"seasons",title:"The turning",when:"Every fortnight",body:`The frontier keeps its own calendar, and it is not the one the old crown used.

    A season out here is whatever the country is doing to you: a hard winter, a road that
    opens, a valley that burns. Each turning brings new riders to the gates — people the
    weather displaced, or the fire, or a court eating itself two hundred miles south.

    They are not better than the ones who came before. The Reach has never produced a
    generation that outclassed its parents, whatever the ballads say. They are only <i>new</i>,
    and they know different country, and the halls that last are the ones that keep making
    room.`}],ws={1:`The Iron Winter closed the passes for a hundred and six days. The halls that held did
      it on stored grain and stubbornness, and the people who came down out of it in spring
      had learned exactly one thing very well: how to not lose.`,2:`When the passes opened the coast came inland. Salt factors, pilots and a certain
      amount of cargo nobody wanted to itemise — the Salt Road ran two seasons and made
      more Wardens rich than any battle ever has.`,3:`The Ashen Vale burned for a month and nobody is entirely sure why. What walked out of
      it were the people who had spent that month learning the habits of things that live in
      fire, which turned out to be a marketable skill.`,4:`The Hollow Crown is what the frontier calls the business in the south, where a court
      spent a year poisoning itself over a throne that had no kingdom attached. The
      survivors came north. Several of them are excellent company and none of them should
      be left alone with a wine cup.`,5:`The Long Thaw is the first season in living memory that asked the Reach to build

b>marching on another player</b>, the one act that is genuinely your choice.</li><li><b>The Infirmary</b> holds the wounded (30 beds before you build one, far more after) and tending them costs resources and time, returning them whole. The one hard limit is beds: wounded past capacity die of their wounds — which is what makes the building matter and healing urgent. Nobody can buy a healing speedup here, so the bill is the cost.</li><li><b>The Command Center</b> grants another march every 5 levels (to 30) and speeds every column by 2% a level — a full one fields seven columns at once.</li><li><b>The Embassy</b> raises how many alliance helps your own builds may take (+2 a level), on top of what your alliance&#39;s Wide Roads research grants everyone.</li><li><b>Research lives in the Great Library</b> (Town Hall 4). Nothing can be studied without one, and <b>its level is the ceiling on every track</b> — a Library 7 means no study passes 7. Each level also speeds study by 2%. Research runs on its own queue and never competes with the build crews.</li><li><b>Refined goods</b>: the Forge (Town Hall 12) smelts iron and wood into <b>Steel</b> without pause; the Runeworks (Town Hall 22) binds stone and steel into <b>Runestone</b>. Their vaults are small — 10% and 3.5% of your raw storage.</li><li>From level 15 every upgrade also costs Steel; from level 24, Runestone too. That is what makes the last third of the game long — and why food, wood, stone and iron never stop mattering: they are the fuel.</li></ul><h3>The Muster</h3><div class="tscroll"><table><tr><th>Troop</th><th>Power</th><th>Cost each</th><th>Time each*</th><th>Eats</th><th>Needs</th></tr>'+a+"</table></div><ul><li>*time shown includes your current ×"+t.toFixed(2)+" training multiplier (Barracks −6%/level, plus heroes, spoils, Mastery). Costs/power/upkeep shown are Tier I — each tier is +25% power, +18% upkeep, +22% cost.</li><li><b>Tiers</b>: the War Academy unlocks Tier II–X. Promoting reforges every unit of that class at once (cost scales with how many you own).</li><li>Army power = troop power × bonuses + 18 per Wall level.</li><li><b>Armies eat.</b> If food hits 0, roughly 2% of troops desert every 10s until the muster is affordable again.</li></ul><h3>Raids</h3><ul><li>A raid strikes every 75s (first at 2m). Strength grows ~wave<sup>1.3</sup>, rolled ±12%.</li><li>Every 5th wave is a <b>Warband</b>: ×1.6 strength, double loot and Valor, always drops a Writ and a choice of Spoils.</li><li>Watchtower: reveals exact enemy strength and blunts it 5% per level"+(et(e,e.b.watchtower)>0?" (yours: "+Math.round(et(e,e.b.watchtower)*100)+"%)":"")+".</li><li><b>Win</b>: loot + Valor + hero XP; casualties scale with how close the fight was.</li><li><b>Lose</b>: 20% of troops fall, 15% of stores are taken — but the band returns 15% weaker per consecutive loss (floor ~61%) and the next attack waits 2m30s. Raids only escalate when you win.</li></ul><h3>Command — where skill lives</h3><ul><li><b>Wave shapes &amp; stances</b>: bands come as Rabble, Riders, Skirmishers, or Brutes. Shield Wall counters Riders, Volley counters Brutes, Charge counters Skirmishers. Right answer: +20% power and 40% fewer casualties. Wrong stance against a shaped band: −8%. Balanced never wins or loses the read. A Watchtower names the incoming band; without one you guess.</li><li><b>Class counters</b>: Spearmen counter Riders, Archers counter Brutes, Knights counter Skirmishers — up to +15% power, scaling with that class&#39;s share of your army (max at 30%). A one-class army leaves this on the table most waves.</li><li><b>The screening line</b>: casualties fall unevenly — Spearmen take 1.5× their share, Archers 1.2×, Knights 0.75×, Ballistas 0.5×. Cheap troops are the armor of expensive ones.</li><li><b>Captain</b>: appoint one hero — their passive counts double. Swap freely; it is a build choice, not a lock.</li><li><b>Orders</b>: every hero has an active ability on a cooldown measured in waves (Rally, Triage, Requisition…). Battle orders are consumed by the next battle.</li><li><b>Expeditions</b>: the King&#39;s Road is safe (food/wood, +3 Valor). Wildwood pays stone &amp; iron but a 35% ambush costs ~4% of troops. Barrow Hills pays Valor &amp; Mastery with a 15% Writ chance. One road per cooldown.</li><li><b>Standing caravan</b>: assign a road and it auto-runs 15s after each cooldown at half yield — resources only, no Valor, no Mastery, no ambush, and it keeps running while you are away (2h cap). Dispatching by hand always pays roughly 2.7× more.</li></ul><h3>Alliances (online)</h3><ul><li>Up to 30 holds under one banner. Members <b>Help</b> each other&#39;s construction: each help cuts 1.5% of a build (at least a minute), up to 20 helps per build, one per hold per build.</li><li>That is the whole anti-P2W thesis in one mechanic — Kingshot sells speedups, here your alliance <i>is</i> the speedup, and it costs nothing but showing up for each other.</li></ul><h3>Chat</h3><ul><li>Four rooms: the whole state, your alliance, direct messages, and private groups anyone can make. The 💬 button sits bottom-right whenever you are signed in.</li></ul><h3>The Frontier</h3><ul><li>Tap a map tile to inspect and <b>march</b> on it: resource nodes (worked for a large haul), Bandit Camps (burned for loot, Valor and Mastery), Ancient Ruins (Valor, Mastery, 20% Writ).</li><li>Travel costs 12s per tile each way; gathering takes 60s. Marching troops carry their own rations and <b>do not defend the wall</b> until they return.</li><li><b>Long haul</b>: work a resource node for "+v(tn)+" instead of a minute and bring back "+an+"× the haul — the thing to set going before you close the game, at the price of an undefended wall until they are home.</li><li>Camp battles use your march&#39;s power — the hold&#39;s bonuses, plus whatever the hero leading it is worth (no wall, no stance). Defeat costs a third of the marchers, wounded not dead.</li><li>You field "+Le(e)+" columns: one, plus another every 5 Command Center levels and one more at Town Hall 10. Each can be given its own hero to lead. Worked tiles regrow in ~4 minutes, sometimes richer.</li></ul><h3>The Arena (online)</h3><ul><li><b>Nothing is stolen.</b> Win or lose, no resources, buildings or defenders change hands — only Laurels (rating), plus Valor and Mastery for the attacker. Nobody can be farmed.</li><li><b>Bracketed</b>: you are only shown holds between 0.65× and 1.35× your defence (widening if the pool is thin), and the server refuses attacks outside 0.3×–2.2× regardless.</li><li><b>The stance triangle</b>: Charge beats Volley, Volley beats Shield Wall, Shield Wall beats Charge — +15% for the right read, −12% for the wrong one. Balanced is neutral. Scouting shows their standing defence, so this is a real decision.</li><li><b>Composition</b>: bring the answer to their dominant class — Spearmen vs Knights, Knights vs Archers and Ballistas, Archers vs Spearmen — up to +15% by share.</li><li><b>Commitment</b>: you send a quarter, half or all of your army. Casualties fall only on what you sent (≤6% winning, ≤14% losing) and they thin the wall that must hold your next raid.</li><li><b>Attack and defence</b>: the attacker strikes with 8% initiative for choosing the hour; the defender&#39;s edge is the wall they paid for. Neglect your Wall and you are a soft target on the ladder.</li><li><b>Defenders</b> fight from a snapshot, lose no troops at all, and risk only half the rating — they were not there to command.</li><li>Laurels move on Elo (K=24), so beating a stronger hold pays more. One attack every 90s.</li></ul><h3>Valor &amp; Writs</h3><ul><li>Valor comes from wins (5 + wave, capped +15, warbands ×2), quests, patrols (+2), finished buildings (+2), even losses (+2). It is never sold.</li><li>Spend it to finish any timer: 1 Valor per 4s remaining. Redrawing a draft costs 5.</li><li><b>Daily quota</b>: Valor earns at full rate up to "+b(Ka(e))+" a day (it grows with your Town Hall), then trickles at a quarter rate. Ten hours of play beats one hour — by about half again, not tenfold. Progression is paced by the calendar, so nobody can be sold a way past it either.</li><li><b>Rested</b>: every hour away banks half an hour of Rest (up to two days&#39; worth). While Rested, production runs +50% and your Valor quota doubles — so a week away is a running start, not a hole.</li><li>Writs of Peace pause raids for 3m. Earned from losses, warbands, and quests; capacity "+Da(e)+".</li></ul><h3>Heroes &amp; Spoils</h3><ul><li><b>"+Object.keys(y).length+" heroes exist; "+Rl(e)+" have arrived so far.</b> Rarity is drafted at weights 62 common / 28 rare / 10 epic. "+Pe.length+" milestones each open a draft of three — you keep one. Never pulled, never sold.</li><li><b>Seasons bring the rest.</b> Every fortnight four more heroes join the pool. They arrive no stronger than the founding twelve, and nothing ever leaves — start in Season 9 and the whole roster is still yours to draft. If a draft comes due with nobody left to offer, the slot waits for the next season rather than being spent.</li><li><b>A hero does one job at a time.</b> Seated in your court, their passive lifts the whole hold — but there are only "+Ee(e)+" chairs (one more every "+ja+" Town Hall levels, to "+Pa+"). Leading a column, they buff that march alone and give up their chair until it comes home.</li><li><b>Three heroes ride at the head of every column</b>, and their levels decide how many troops it can hold: "+Vt+" + "+Nt+" per level each, over a base of 6. Yours currently command <b>"+on(e,is(e,le))+"</b>. March slots are given by the Command Center; the capacity to fill them is earned hero by hero.</li><li><b>Every hero knows one troop class.</b> They add +"+Math.round(nt*100)+"% per level to that troop type in their column, so three cavalry heroes leading knights hit far harder than a mixed party. This is what makes a wide roster worth having — and with "+Le(e)+" march slots and three leaders each,
