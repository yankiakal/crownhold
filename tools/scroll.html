<!-- Does a sheet stay where you scrolled it? `npm run scroll`
     Reported from play: "I can't scroll down on anything, for example the Codex, when I'm trying to
     gather the popup windows."

     The suspect is not CSS. The overlay layer and the card inside it both declare overflow-y:auto
     and always have. What the tick loop does is rewrite `fx.innerHTML` — the entire overlay layer,
     Codex and detail sheets included — every 250ms, which destroys and rebuilds those nodes four
     times a second, and a fresh element's scrollTop is 0. So a player drags a tall sheet and a
     quarter of a second later is holding a different element, sitting at the top.

     No unit test can see it: verify-ui renders against a stub DOM with no layout, no scrollHeight
     and no scrolling at all. It needs a real browser, a real overflowing sheet, and a real wait
     across at least one tick. The report is POSTed back to the harness server, on real time —
     `--virtual-time-budget` with `--dump-dom` hung on this page twice and passed once. -->
<!doctype html>
<html><head><meta charset="utf-8"><title>scroll probe</title>
<style>
  body{margin:0;background:#0d0b09;color:#d9a441;font:12px ui-monospace,monospace}
  pre{padding:10px;line-height:1.5;white-space:pre-wrap}
  iframe{border:1px solid #3a2f25;width:393px;height:852px;display:block}
  .rack{display:flex;gap:8px;padding:8px}
</style>
</head><body>
<div class="rack"><iframe id="f"></iframe></div>
<pre id="out">running…</pre>
<script type="module">
import { freshState, SAVE_KEY } from '../src/state.js';

function played(){
  const now = Date.now();
  const s = freshState(now, 11);
  Object.assign(s.b, { townhall:14, farm:15, lumberyard:14, quarry:12, ironmine:11,
    barracks:12, range:10, stable:9, siegeyard:8, wall:12, watchtower:6, tavern:8,
    granary:9, academy:12, hospital:8, warehouse:7, library:10, command:10, embassy:6 });
  s.tier = { spearman:4, archer:4, knight:3, ballista:3 };
  s.t = { spearman:260, archer:150, knight:70, ballista:35 };
  for(const id of ['marshal','gatekeeper','forager','steward','medic'])
    s.heroes[id] = { lvl:14, xp:120, stars:2, deeds:3, gear:{}, skills:[null,null,null] };
  s.court = ['steward','gatekeeper'];
  s.valor = 260; s.wave = 34; s.wavesWon = 33;
  /* Enough to actually build with. Seeded from freshState the purse is 500/500/250 against
     level-15 buildings, so every upgrade button rendered disabled and the badge probe reported
     "no buildable building" as though that were a finding about the game. */
  s.res = { food:9e5, wood:9e5, stone:9e5, iron:9e5, steel:9e5, runestone:9e5,
            rations:0, isleore:0, electrum:0 };
  s.seenIntro = true; s.offersDone = 12;
  s.choice = null; s.choiceQueue = [];
  s.taught = { upkeep:1, pace:1, cover:1, load:1 };
  s.now = now; s.lastSeen = now;
  return s;
}

const lines = [];
const out = document.getElementById('out');
const say = (t) => { lines.push(t); out.textContent = lines.join('\n'); };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const done = () => fetch('/report', { method:'POST', body: lines.join('\n') }).catch(() => {});

/* Anything that throws still has to report, or the harness waits out its whole deadline and says
   "nothing measured" when what actually happened was a TypeError on line four. */
window.addEventListener('error', (e) => { say('THREW: ' + e.message); done(); });
/* ── a watchdog, so a hang says WHERE ──
   Nothing is reported until done() posts, so an await that never settles produced three minutes of
   silence and then "nothing measured" — which tells you the probe broke and nothing about where. This
   posts whatever has been collected so far, which turns a mystery into a line number. */
setTimeout(() => { say('WATCHDOG: the probe stopped here'); done(); }, 100000);
/* And rejections. The probe is one long chain of awaits, so a throw inside it becomes an unhandled
   REJECTION, which does not fire the 'error' event above — so the page simply stopped, never reported,
   and the runner said "nothing measured within 180s". Three minutes of silence for a one-line mistake,
   twice, before this listener existed. */
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  say('REJECTED: ' + ((r && (r.stack || r.message)) || String(r)));
  done();
});

try {
  const save = played();
  localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  const f = document.getElementById('f');
  f.src = '../index.html';
  await new Promise(r => f.addEventListener('load', r, { once:true }));
  await wait(1500);

  const w = f.contentWindow, d = f.contentDocument;
  const click = (sel) => { const b = d.querySelector(sel); if(b){ b.click(); return true; } return false; };

  /* Scroll a surface, wait past two ticks of the 250ms loop, and see whether it stayed put.
     `node was replaced` is the diagnosis, not the assertion — it says WHY when it fails. */
  async function probe(name, open, find){
    if(!(await open())){ say(name.padEnd(16) + ' COULD NOT OPEN — nothing measured'); return; }
    await wait(500);
    const el = find();
    if(!el){ say(name.padEnd(16) + ' NO SCROLLER FOUND'); return; }
    const over = el.scrollHeight - el.clientHeight;
    if(over < 40){
      say(name.padEnd(16) + ' does not overflow (' + el.scrollHeight + ' in ' + el.clientHeight
        + ') — nothing to scroll');
      return;
    }
    el.scrollTop = Math.min(200, over);
    const put = el.scrollTop;
    await wait(800);
    const after = find();
    const now = after ? after.scrollTop : -1;
    say(name.padEnd(16) + ' overflow ' + over + 'px · put ' + Math.round(put)
      + ' → 800ms later ' + Math.round(now)
      + (Math.abs(now - put) < 4 ? '  KEPT' : '  LOST')
      + (after === el ? '' : '  (node was replaced)'));
  }

  // ── the Codex, opened from the footer. data-act="codex" toggles it, so the same click closes it.
  await probe('codex', async () => click('[data-act="codex"]'), () => d.querySelector('.card.codex'));
  click('[data-act="codex"]');
  await wait(400);
  say('codex closed'.padEnd(16) + (d.querySelector('.card.codex') ? ' NO — still open, the next probe would remeasure it' : ' yes'));

  /* ── a frontier tile sheet: the "when I'm trying to gather" half of the report.
     The map is a canvas, so there is no element to click — the coordinates have to be computed
     from a REAL tile. The first version of this dispatched a click at 20% across and hit empty
     ground, opened nothing, and then found the still-open Codex under `.overlay .card` and
     reported its scroll as the gather sheet's. Two rows, one measurement. */
  await probe('gather sheet', async () => {
    click('[data-act="tab"][data-key="world"]');
    await wait(400);
    const cv = d.getElementById('worldmap');
    if(!cv) return false;
    const MAP_W = 15, MAP_H = 9;
    /* The real type keys are woods / farmstead / quarry / ironvein. The first version of this
       looked for 'wood' and 'stone', matched nothing, and fell through to tiles[0]. */
    const tile = save.world.tiles.find(t => ['woods','farmstead','quarry','ironvein'].includes(t.type));
    if(!tile){ say('  (no gather tile in the seeded world)'); return false; }
    const r = cv.getBoundingClientRect();
    const cx = r.left + (tile.x + 0.5) / MAP_W * r.width;
    const cy = r.top  + (tile.y + 0.5) / MAP_H * r.height;
    /* pointerdown, not click. The canvas handler is bound to pointerdown — its own comment says
       "so the 4 Hz re-render can never swallow a click", which is this same bug seen from the
       other side. A dispatched 'click' reaches nothing and opens nothing. */
    /* down AND up: the frontier is a camera now and acts on RELEASE, so a lone pointerdown opens
       nothing — which the probe reported as "no sheet", i.e. as a bug in the game. */
    for(const type of ['pointerdown', 'pointerup'])
      cv.dispatchEvent(new w.PointerEvent(type, { bubbles:true, pointerId: 7, isPrimary: true,
                                                  clientX: cx, clientY: cy }));
    await wait(400);
    if(!d.querySelector('.overlay'))
      say('  (clicked ' + tile.type + ' at ' + tile.x + ',' + tile.y + ' → ' + Math.round(cx) + ',' + Math.round(cy)
        + ' in a ' + Math.round(r.width) + '×' + Math.round(r.height) + ' canvas at ' + Math.round(r.left) + ',' + Math.round(r.top) + ' — no sheet)');
    return !!d.querySelector('.overlay');
  }, () => {
    const card = d.querySelector('.overlay .card');
    if(!card) return null;
    // whichever layer actually overflows is the one the player drags
    return (card.scrollHeight - card.clientHeight) > 40 ? card : d.querySelector('.overlay');
  });

  /* ── can you actually SEE the frontier? ──
     Reported with two screenshots: "it's still fucked even when zoomed out" — a couple of enormous
     blurry glyphs, black below them, and pinching out did not help.

     Three numbers say why, and none of them is reachable from a stub DOM:
       · the canvas BACKING STORE against the 840×504 world drawMap paints. A canvas element made
         with createElement and never given width/height is 300×150, so most of the map is painted
         off the edge of the buffer and the scrap that landed is stretched — which is the blur.
       · TILES ACROSS at the minimum zoom. A 15-wide map you can only see four columns of is not a
         map you can plan on.
       · the canvas against its dock. Zoomed out under a cover-fit floor the canvas ends up SHORTER
         than the viewport, and the gap below it is the black void in the screenshot. */
  {
    /* Back to the hold FIRST. A tab tap toggles — "tapping the tab you are already on closes its
       sheet" — and the gather probe left this one on world, so clicking world sent it to hold and
       the dock was measured at display:none. Every number came back 0 and the probe reported the
       camera as broken in a way it was not. */
    click('[data-act="detailClose"]');
    await wait(200);
    click('[data-act="tab"][data-key="hold"]');
    await wait(300);
    click('[data-act="tab"][data-key="world"]');
    await wait(700);
    const cv = d.getElementById('worldmap'), dock = d.getElementById('map-dock');
    if(!cv || !dock) say('frontier'.padEnd(16) + ' NO MAP CANVAS');
    else {
      const MAP_W = 15, MAP_H = 9, C = 56;   // the world drawMap paints, in its own units
      const want = MAP_W * C + '×' + MAP_H * C;
      const got = cv.width + '×' + cv.height;
      /* Enough buffer to hold the drawing at the size it is displayed. A store SMALLER than the
         painted world clips it; a store smaller than the CSS box is merely blurry. Both are faults,
         and the first is the one that hides the map. */
      const clipped = cv.width < MAP_W * C || cv.height < MAP_H * C;
      say('map buffer'.padEnd(16) + got + ' for a ' + want + ' drawing'
        + (clipped ? '  CLIPPED' : '  HOLDS THE MAP'));

      const r = cv.getBoundingClientRect(), dr = dock.getBoundingClientRect();
      const sharp = r.width > 0 && cv.width / r.width >= 0.9;
      say('map sharpness'.padEnd(16) + Math.round(r.width) + 'px wide from a ' + cv.width
        + 'px buffer — ' + (r.width ? (cv.width / r.width).toFixed(2) : '?') + '× device pixels'
        + (sharp ? '  SHARP' : '  BLURRY'));

      /* Two demands that conflict on a 393px screen, so they are checked at the two moments they
         apply. What it OPENS at has to be tappable — fifteen columns squeezed into a phone makes
         26px cells, under the 44px a thumb can reliably hit. */
      const cell = r.width / MAP_W;
      say('map opens at'.padEnd(16) + cell.toFixed(0) + 'px cells, '
        + (r.width ? (dr.width / cell).toFixed(1) : '?') + ' columns in view'
        + (cell >= 44 ? '  THUMB-SIZED' : '  TOO SMALL TO TAP'));

      /* The void. A map smaller than its dock has to sit in the FREE ROOM — below the frontier card,
         above the tab bar — and be roughly centred in it. Measured against that furniture rather
         than against the raw viewport: the camera is fullscreen and the card floats over its top, so
         a map centred in the dock hides behind the card, and a map centred in the room reads as a
         void to any check that only knows about the dock. This assertion is the intent, not the
         geometry that happened: hidden under the card, under the tab bar, or shoved into a corner of
         its room all fail. */
      const card = d.querySelector('.tabpane.sheet.on[data-pane="world"] section');
      const bar = d.querySelector('.tabbar');
      const cb = card ? card.getBoundingClientRect().bottom : dr.top;
      const bt = bar ? bar.getBoundingClientRect().top : dr.bottom;
      const above = Math.round(r.top - cb), below = Math.round(bt - r.bottom);
      /* both non-negative means it is clear of the furniture; within 24px of each other means it is
         centred in what is left. When the map overflows its room, only clearance matters. */
      const fits = r.height <= (bt - cb) + 2;
      const placed = above >= -2 && below >= -2 && (!fits || Math.abs(above - below) <= 24);
      say('map in its room'.padEnd(16) + Math.round(r.width) + '×' + Math.round(r.height)
        + ' in ' + Math.round(dr.width) + '×' + Math.round(dr.height) + ' dock · '
        + above + 'px under the card, ' + below + 'px above the tab bar'
        + (placed ? '  IN ITS ROOM' : '  VOID'));

      /* ── the panels are furniture, and furniture has a budget ──
         "It should be only map and buttons." The two cards that used to live here came to more than
         a phone's height between them, so the map was complete and entirely behind them. A share of
         the screen is the honest way to state that rule, and it is the one a new panel would break. */
      let furn = 0;
      d.querySelectorAll('.tabpane.sheet.on[data-pane="world"] section')
        .forEach(sec => { furn += sec.getBoundingClientRect().height; });
      say('frontier panels'.padEnd(16) + Math.round(furn) + 'px of ' + Math.round(dr.height)
        + ' — ' + Math.round(100 * furn / dr.height) + '% of the screen'
        + (furn <= dr.height * 0.30 ? '  FURNITURE' : '  BURIES THE MAP'));

      /* ── up and down ──
         Reported: "zoom out zoom in works, scroll left right works, scroll up and down doesn't."
         At the opening zoom that is correct and not a fault — the map is 15×9, so fitting the width
         puts all nine rows on screen and there is nothing above or below to reach. But it stops
         being correct the moment you pinch IN, and this is where the fault would be: whether the
         vertical axis gains a range at all, and whether the top of the map can be scrolled clear of
         the ribbon rather than sliding underneath it. Driven through the same handlers a thumb goes
         through, one finger, because reading the clamp would only prove the arithmetic. */
      {
        const mid0 = { x: dr.left + dr.width / 2, y: dr.top + dr.height / 2 };
        const send0 = (type, id, x, y) => dock.dispatchEvent(new w.PointerEvent(type, {
          bubbles:true, pointerId:id, isPrimary:id===1, clientX:x, clientY:y }));
        // pinch IN: fingers apart
        send0('pointerdown', 3, mid0.x - 20, mid0.y);
        send0('pointerdown', 4, mid0.x + 20, mid0.y);
        for(let step = 40; step <= 300; step += 40){
          send0('pointermove', 3, mid0.x - step, mid0.y);
          send0('pointermove', 4, mid0.x + step, mid0.y);
        }
        send0('pointerup', 3, mid0.x - 300, mid0.y);
        send0('pointerup', 4, mid0.x + 300, mid0.y);
        await wait(400);
        const range = dock.scrollHeight - dock.clientHeight;
        say('zoomed in'.padEnd(16) + 'map ' + Math.round(cv.getBoundingClientRect().height)
          + 'px tall in ' + dock.clientHeight + ' · ' + range + 'px of vertical range'
          + (range > 20 ? '  CAN GO DOWN' : '  NOWHERE TO GO'));

        // and a one-finger drag has to actually move it
        dock.scrollTop = Math.round(range / 2);
        const was = dock.scrollTop;
        send0('pointerdown', 5, mid0.x, mid0.y + 120);
        for(let dy = 20; dy <= 100; dy += 20) send0('pointermove', 5, mid0.x, mid0.y + 120 - dy);
        send0('pointerup', 5, mid0.x, mid0.y + 20);
        await wait(300);
        say('drag upward'.padEnd(16) + 'scrollTop ' + was + ' → ' + Math.round(dock.scrollTop)
          + (dock.scrollTop > was + 10 ? '  PANS' : '  STUCK'));

        /* The top row must be reachable from under the furniture. Scrolled fully up, the map's own
           top edge should sit BELOW the ribbon — otherwise zooming in hides the northern row behind
           a card, which is the bug this whole session has been about, one axis over. */
        dock.scrollTop = 0;
        await wait(250);
        const rt = cv.getBoundingClientRect().top;
        say('top row clear'.padEnd(16) + 'map top ' + Math.round(rt) + ' vs card bottom '
          + Math.round(cb) + (rt >= cb - 2 ? '  CLEAR' : '  UNDER THE CARD'));
      }

      /* ── and the other half: can you get OUT? ──
         "It's still fucked even when zoomed out" was the report, so the check drives the actual
         gesture rather than reading the clamp: two fingers, moved together, through wireCamera's own
         pointer handlers. Reading `mapZoom` would only prove the arithmetic; this proves the pinch
         reaches it, which is the thing that was broken. */
      const mid = { x: dr.left + dr.width / 2, y: dr.top + dr.height / 2 };
      const send = (type, id, x, y) => dock.dispatchEvent(new w.PointerEvent(type, {
        bubbles:true, pointerId:id, isPrimary:id===1, clientX:x, clientY:y }));
      send('pointerdown', 1, mid.x - 150, mid.y);
      send('pointerdown', 2, mid.x + 150, mid.y);
      for(let step = 140; step >= 20; step -= 30){          // fingers converge → factor < 1
        send('pointermove', 1, mid.x - step, mid.y);
        send('pointermove', 2, mid.x + step, mid.y);
      }
      send('pointerup', 1, mid.x - 20, mid.y);
      send('pointerup', 2, mid.x + 20, mid.y);
      await wait(500);
      const r2 = cv.getBoundingClientRect();
      const out = r2.width ? dr.width / (r2.width / MAP_W) : 0;
      say('pinch out'.padEnd(16) + Math.round(r.width) + 'px → ' + Math.round(r2.width) + 'px · '
        + out.toFixed(1) + ' of ' + MAP_W + ' columns in view'
        + (out >= MAP_W - 0.5 ? '  WHOLE MAP' : '  CANNOT ZOOM OUT'));
    }
    click('[data-act="tab"][data-key="hold"]');
    await wait(400);
  }

  /* ── badges that sit on the buildings ──
     The WoS-style build timer floats over the building it belongs to, positioned by plotScreen —
     the exact inverse of the tap hit-test. Arithmetic like that cannot be checked by reading it:
     it needs a real canvas with a real bounding box, which is why it is measured here rather than
     in verify-ui, where every rect is a 360×360 stub.

     Lives in this file rather than a second Chrome harness because booting the game in a browser is
     the expensive part, and one probe that answers two questions beats two that each answer one. */
  {
    /* Close whatever the earlier probes left open FIRST. The gather sheet was still up, so the hold
       pane underneath had no layout, the scene slot measured 0×0, and the badge was placed against
       an origin of nothing — which looked like a positioning bug in the game and was a sequencing
       bug in the probe. */
    click('[data-act="detailClose"]');
    await wait(200);
    click('[data-act="tab"][data-key="hold"]');
    await wait(700);
    const before = d.querySelectorAll('.sbadge').length;
    // start a real build the way a player would: the action the buttons dispatch
    /* data-act="upgrade" — the name the buttons actually carry. "build" matched nothing, and the
       probe dutifully reported NO BUILDABLE BUILDING, which reads like a finding about the game. */
    const btn = Array.from(d.querySelectorAll('button[data-act="upgrade"]'))
      .find(b => !b.disabled);
    if(!btn){
      const all = d.querySelectorAll('button[data-act="upgrade"]');
      const q = d.querySelectorAll('.queue-strip').length;
      say('scene badge'.padEnd(16) + ' NO BUILDABLE BUILDING — ' + all.length + ' upgrade buttons, '
        + Array.from(all).filter(b => b.disabled).length + ' disabled, ' + q + ' queue strips already running');
    }
    else {
      btn.click();
      await wait(600);
      const badges = Array.from(d.querySelectorAll('.sbadge'));
      say('scene badge'.padEnd(16) + ' ' + before + ' → ' + badges.length + ' after starting a build'
        + (badges.length > before ? '  APPEARED' : '  MISSING'));
      if(badges.length){
        const b = badges[0].getBoundingClientRect();
        /* Re-queried HERE, not captured earlier. render() replaces app.innerHTML, so a reference
           taken before the build started points at a detached node whose rect is 0×0 — which the
           probe then reported as the badge being off the scene. The element was fine; the ruler
           had been thrown away. */
        /* Measured against the CANVAS, not the scroll viewport. The walls are wider than a phone, so
           the slot scrolls — a badge on a building currently scrolled out of view is correctly
           placed and outside the viewport, and comparing the two reported a real badge as
           misplaced. The canvas is the coordinate space plotScreen works in, so it is the one to
           check containment against. */
        const cvr = d.getElementById('holdscene')?.getBoundingClientRect() || null;
        const inside = cvr && b.left >= cvr.left - 30 && b.left <= cvr.right + 30
                           && b.top >= cvr.top - 30 && b.top <= cvr.bottom + 30;
        say('badge position'.padEnd(16) + ' ' + Math.round(b.left) + ',' + Math.round(b.top)
          + ' on walls at ' + (cvr ? Math.round(cvr.left) + ',' + Math.round(cvr.top)
              + ' ' + Math.round(cvr.width) + '×' + Math.round(cvr.height) : '?')
          + (inside ? '  ON THE WALLS' : '  OFF THE WALLS'));
        say('badge text'.padEnd(16) + ' "' + (badges[0].textContent || '').trim() + '"'
          + (/\d/.test(badges[0].textContent || '') ? '  COUNTS DOWN' : '  NO TIME SHOWN'));
        // and it has to be the way into that building
        badges[0].click();
        await wait(400);
        // v3.6: a badge raises the on-building POPUP now; the sheet moved behind its ⓘ
        say('badge opens it'.padEnd(16) + (d.querySelector('.bpeek, .overlay .card.dsheet') ? '  yes' : '  NO SHEET'));

        /* ── the feed, in a real browser ──
           Starting a build is one of the sixty-four things the rules log, so by now a toast should
           have appeared. Two properties matter and neither is visible to a stub DOM: that it renders
           at all, and that it is INERT. It floats over the hold and the frontier map, so if it takes
           pointer events it silently eats taps aimed at whatever is underneath — which would trade
           the feedback problem for a worse one. */
        const toast = d.querySelector('.feeditem');
        say('feed toast'.padEnd(16) + (toast ? '"' + (toast.textContent || '').trim().slice(0, 34) + '"'
              : 'NO TOAST — a build was started and nothing said so'));
        if(toast){
          const box = d.getElementById('feed');
          const pe = w.getComputedStyle(box).pointerEvents;
          say('feed is inert'.padEnd(16) + 'pointer-events: ' + pe
            + (pe === 'none' ? '  INERT' : '  EATS TAPS'));
          const fr = box.getBoundingClientRect();
          const bar = d.querySelector('.tabbar');
          const bt = bar ? bar.getBoundingClientRect().top : w.innerHeight;
          say('feed vs tabs'.padEnd(16) + 'bottom ' + Math.round(fr.bottom) + ' vs bar top '
            + Math.round(bt) + (fr.bottom <= bt + 2 ? '  ABOVE IT' : '  OVER THE TABS'));
        }
        click('[data-act="peekClose"]'); click('[data-act="detailClose"]');
        await wait(300);
      }
    }
  }

  /* ── a tap lands on the building you can SEE ──
     The game's most-used gesture, and the one thing verify-ui cannot witness: pickBuilding needs a real
     canvas with a real bounding rect to turn a pointer into tile coordinates, and the stub DOM has
     neither. So the rule is tested there and the WIRE is tested here.

     The bug: a tap was resolved from the ground tile under the finger plus one tile of slop down-right,
     and a building is drawn ABOVE its own tile by more the taller it is — so a tap on a body answered
     with the neighbour in front. Measured over every building at every level: 83% right at level 1, 60%
     at level 20. The Town Hall was wrong across 71% of its own body and always answered "Embassy".

     Aimed without needing the camera's internals. The Town Hall stands at [4,4], the centre of a 9x9
     grid, so its base is the centre of the drawn map; the Embassy at [3,4] is off that centre line
     entirely. Sweeping straight up the middle therefore must name the Town Hall and must never name the
     Embassy — which is exactly what it did before, for most of the keep. */
  {
    click('[data-act="tab"][data-key="hold"]');
    await wait(500);
    const cv2 = d.getElementById('holdscene');
    const dock = d.getElementById('scene-dock');
    if(!cv2 || !dock){ say('hold tap'.padEnd(16) + ' NO HOLD CANVAS'); }
    else {
      const r = cv2.getBoundingClientRect();
      const cx = r.left + r.width / 2, base = r.top + r.height / 2;
      /* Through the dock, as a thumb does: the phone camera owns these taps and resolves them on
         RELEASE, so a lone pointerdown opens nothing — the same lesson the frontier probe records. */
      const tapAt = async (x, y) => {
        for(const type of ['pointerdown', 'pointerup'])
          dock.dispatchEvent(new w.PointerEvent(type, { bubbles:true, pointerId: 11, isPrimary:true,
                                                        clientX: x, clientY: y }));
        await wait(320);
        const head = d.querySelector('.bpeek .bp-head span');
        return head ? head.textContent.trim() : null;
      };
      /* Far enough up to leave the keep's roof. 64px was not: at this camera's scale that is only the
         lower half of the body, which the OLD code got right — so the probe passed with the bug put
         back, which is the worst possible outcome for a test. */
      const seen = [];
      for(let up = 0; up <= 200; up += 10) seen.push((await tapAt(cx, base - up)) || '—');
      say('hold tap sweep'.padEnd(16) + seen.map(t => t.replace(/^\S+\s/, '')).join('/'));
      /* The keep's CONTIGUOUS run from its own base. That is the number the bug moved: the old rule lost
         the keep partway up its body and started answering with the Embassy behind it. Above the roof
         either rule answers with whatever is further back, so only the run from the base is meaningful. */
      let run = 0;
      while(run < seen.length && /Town Hall/.test(seen[run])) run++;
      say('keep run'.padEnd(16) + (run * 10) + 'px of the keep answers "Town Hall" from its base up'
        + (run * 10 < 100 ? '  KEEP LOST PARTWAY UP' : ''));
      const named = seen.filter(t => t !== '—');
      const hall = named.filter(t => /Town Hall/.test(t)).length;
      say('tap the keep'.padEnd(16) + hall + ' of ' + seen.length + ' taps up the keep named it'
        + (hall === 0 ? '  KEEP UNTAPPABLE' : ''));
      if(!named.length) say('hold tap'.padEnd(16) + ' NO POPUP FROM ANY TAP — the scene took no taps at all');
      click('[data-act="peekClose"]');
      await wait(250);
      say('hold left clean'.padEnd(16) + (d.querySelector('.bpeek') ? ' POPUP STILL UP' : ' yes'));
    }
  }

  /* ── rearranging the hold ──
     The taps themselves can only be proved here: verify-ui has no canvas, so it cannot turn a pointer
     into a tile at all. Two taps, not a drag — at this zoom the walls are 1312px inside a 393px window,
     so a finger carrying a building cannot also pan to where it is going.

     Verified by SWAPPING, which needs no knowledge of the camera's scale or origin: find two points that
     lift two different buildings, swap them, and then check each point now names the other one. If the
     lift, the placement, the state write and the redraw all work, the two names have exchanged; if any
     one of them is broken, they have not. */
  {
    click('[data-act="tab"][data-key="hold"]');
    await wait(400);
    const cv3 = d.getElementById('holdscene');
    const dock3 = d.getElementById('scene-dock');
    if(!cv3 || !dock3){ say('arrange'.padEnd(16) + ' NO HOLD CANVAS'); }
    else {
      const tap = async (x, y) => {
        for(const type of ['pointerdown', 'pointerup'])
          dock3.dispatchEvent(new w.PointerEvent(type, { bubbles:true, pointerId: 21, isPrimary:true,
                                                         clientX: x, clientY: y }));
        await wait(300);
      };
      const pill = () => { const el = d.querySelector('.stat-note.arrangebar');
                           return el ? el.textContent.replace(/\s+/g, ' ').trim() : null; };
      const inHand = () => { const t = pill() || ''; const m = t.match(/^(.*?) in hand/); return m ? m[1] : null; };
      const named = () => { const h = d.querySelector('.bpeek .bp-head span');
                            return h ? h.textContent.trim() : null; };

      say('arrange offered'.padEnd(16) + (d.querySelector('[data-act="arrange"]') ? 'yes' : 'NO ARRANGE BUTTON'));
      click('[data-act="arrange"]');
      await wait(400);
      say('arrange entered'.padEnd(16) + (pill() ? '"' + pill().slice(0, 46) + '"' : 'NO ARRANGE PILL'));

      /* Two points that lift two DIFFERENT buildings. Swept off the centre, because the Town Hall is
         pinned — the road is a hardcoded L to its tile — so the middle deliberately lifts nothing. */
      const r3 = cv3.getBoundingClientRect();
      const cx3 = r3.left + r3.width / 2, cy3 = r3.top + r3.height / 2;
      const found = [];
      for(const [dx, dy] of [[-90,0],[90,0],[0,70],[0,-70],[-150,40],[150,40],[-60,-40],[60,-40]]){
        if(inHand()) click('[data-act="arrangeDrop"]'), await wait(220);
        await tap(cx3 + dx, cy3 + dy);
        const got = inHand();
        if(got && !found.some(f => f.name === got)) found.push({ name: got, x: cx3 + dx, y: cy3 + dy });
        if(found.length >= 2) break;
      }
      say('lifts a building'.padEnd(16) + (found.length ? found.map(f => f.name).join(' + ')
        : 'NOTHING LIFTED BY ANY TAP'));
      /* The pinned hall must refuse to be lifted at all. */
      if(inHand()) click('[data-act="arrangeDrop"]'), await wait(220);
      await tap(cx3, cy3);
      say('the hall is pinned'.padEnd(16) + (inHand() ? 'LIFTED THE TOWN HALL' : 'refused, correctly'));

      if(found.length < 2){ say('arrange swap'.padEnd(16) + ' NOT ENOUGH LIFTED TO SWAP'); }
      else {
        const [A, B] = found;
        /* ── and the SCENE has to redraw ──
           The popup's name comes from state, so a swap that never reached the canvas would pass every
           assertion above. The hold is drawn in two passes and the slow one is BAKED behind a cache key;
           that key knew every building's level and not its position, so a moved building would have kept
           being drawn where it used to stand until something unrelated happened to change. Sampled
           pixels are the only witness to that. */
        const shot = () => {
          try {
            const g = cv3.getContext('2d');
            const px = g.getImageData(Math.round(cv3.width * 0.25), Math.round(cv3.height * 0.25),
                                      Math.round(cv3.width * 0.5), Math.round(cv3.height * 0.5)).data;
            let h = 0;
            for(let i = 0; i < px.length; i += 97) h = (h * 31 + px[i]) | 0;
            return h;
          } catch(err){ return null; }
        };
        const before = shot();
        if(inHand()) click('[data-act="arrangeDrop"]'), await wait(220);
        await tap(A.x, A.y);
        const held = inHand();
        await tap(B.x, B.y);
        const after = inHand();
        say('sets it down'.padEnd(16) + 'held "' + held + '", then '
          + (after ? 'STILL IN HAND: ' + after : 'hands empty'));
        click('[data-act="arrangeDone"]');
        await wait(600);
        const pixelsAfter = shot();
        say('the scene redrew'.padEnd(16) + (before === null ? 'COULD NOT SAMPLE THE CANVAS'
          : before === pixelsAfter ? 'pixels identical after a swap  SCENE DID NOT REDRAW'
          : 'pixels changed'));
        /* And the proof: each point now names the other building. */
        await tap(A.x, A.y);
        const atA = named();
        click('[data-act="peekClose"]'); await wait(200);
        await tap(B.x, B.y);
        const atB = named();
        click('[data-act="peekClose"]'); await wait(200);
        const swapped = atA && atB && atA.includes(B.name.replace(/^\S+\s/, ''))
                                  && atB.includes(A.name.replace(/^\S+\s/, ''));
        say('they swapped'.padEnd(16) + A.name + '@A + ' + B.name + '@B → ' + atA + '@A + ' + atB + '@B'
          + (swapped ? '  SWAPPED' : '  DID NOT SWAP'));
      }
      /* Straighten up must put everything back where the masons drew it. */
      click('[data-act="arrange"]'); await wait(300);
      click('[data-act="straighten"]'); await wait(500);
      click('[data-act="arrangeDone"]'); await wait(400);
      if(found.length >= 2){
        await tap(found[0].x, found[0].y);
        const back = named();
        say('straighten up'.padEnd(16) + 'point A names ' + back
          + (back && back.includes(found[0].name.replace(/^\S+\s/, '')) ? '  BACK TO THE DRAWING'
                                                                       : '  STRAIGHTEN DID NOT RESTORE'));
        click('[data-act="peekClose"]'); await wait(200);
      }
      say('arrange left clean'.padEnd(16) + (d.querySelector('.stat-note.arrangebar') ? 'STILL ARRANGING' : 'yes'));
    }
  }

  /* ── the Events tab, in a real browser ──
     Two things a stub DOM cannot judge, and both of them are how this rework would fail quietly.

     The week grid is a seven-column TABLE inside a 393px sheet. A table that overflows does not
     wrap or clip visibly — it pushes the page sideways, and the symptom a player reports is "the
     whole screen slides about", which is the fault `html,body{overflow-x:hidden}` was added for and
     which then broke position:sticky elsewhere. So the grid is measured against its own wrapper.

     And the tab bar now has EIGHT buttons where it had seven. At 393px that is 49px each, which is
     over the 44px thumb minimum by four pixels — worth measuring in a real browser rather than
     trusting, because the uppercase labels inside were already at the width where "ALLIANCE" did
     not fit and had to become "ALLY". */
  {
    click('[data-act="tab"][data-key="events"]');
    await wait(600);
    const pane = d.querySelector('.tabpane.sheet.on[data-pane="events"]');
    if(!pane){ say('events tab'.padEnd(16) + ' COULD NOT OPEN — nothing measured'); }
    else {
      const cards = pane.querySelectorAll('.evcard');
      say('event cards'.padEnd(16) + cards.length + ' live'
        + (cards.length === 5 ? '  FIVE LANES' : '  NOT FIVE'));
      const levy = pane.querySelector('.evcard.levy');
      say('the levy card'.padEnd(16) + (levy
        ? Math.round(levy.getBoundingClientRect().height) + 'px, '
          + (levy.querySelector('.levylock') ? 'explains itself' : 'NO EXPLANATION')
        : 'MISSING'));

      const cal = pane.querySelector('table.cal'), wrap = pane.querySelector('.calwrap');
      if(!cal || !wrap){ say('week grid'.padEnd(16) + ' NO GRID'); }
      else {
        const over = cal.scrollWidth - wrap.clientWidth;
        say('week grid'.padEnd(16) + cal.scrollWidth + 'px in a ' + wrap.clientWidth + 'px wrapper'
          + (over <= 1 ? '  FITS' : '  ' + over + 'px OVER'));
        /* The page itself must not have gained a sideways scroll. A table is the classic way to
           give one to a body that thought it could not have one. */
        const de = d.documentElement;
        say('page sideways'.padEnd(16) + de.scrollWidth + ' vs ' + de.clientWidth
          + (de.scrollWidth <= de.clientWidth + 1 ? '  NONE' : '  PAGE SLIDES'));
        const cells = [...cal.querySelectorAll('tbody td')];
        const thin = cells.filter(c => c.getBoundingClientRect().width < 26);
        say('day cells'.padEnd(16) + cells.length + ' cells, narrowest '
          + Math.round(Math.min(...cells.map(c => c.getBoundingClientRect().width))) + 'px'
          + (thin.length ? '  ' + thin.length + ' TOO NARROW' : '  AN ICON FITS'));
        const blank = cells.filter(c => !c.querySelector('.cev'));
        say('grid is filled'.padEnd(16) + blank.length + ' empty of ' + cells.length
          + (blank.length ? '  EMPTY DAYS' : '  NO GAPS'));
      }
      /* The sheet is long — four cards, a slate and a grid. It has to hold its scroll like the rest. */
      await probe('events sheet', async () => true, () =>
        d.querySelector('.tabpane.sheet.on[data-pane="events"]'));
    }
    /* ── the tab bar ──
       Re-queried immediately before every measurement, never held across a wait. render() replaces this
       whole subtree four times a second, so a node grabbed and then measured after any delay is a
       DETACHED node and reports 0x0 — which reads as "a button too small to press" and is nothing of the
       kind. The first version of this probe measured straight after querying and was right by luck; the
       "hardening" that added a settle wait before measuring broke it, and reported every tab as 0px. */
    const barNow = () => d.querySelector('.tabbar');
    const measure = () => {
      const b = barNow();
      if(!b) return null;
      const btns = [...b.querySelectorAll('button')];
      return { bar: b, btns, rects: btns.map(x => x.getBoundingClientRect()) };
    };
    let m = measure();
    if(m && m.rects.some(r => r.width === 0)){ await wait(300); m = measure(); }
    if(!m){ say('tab bar'.padEnd(16) + ' NO TAB BAR'); }
    else if(m.rects.some(r => r.width === 0)){
      say('tab bar'.padEnd(16) + ' MEASURED MID-RENDER — harness fault, not a game one');
    }
    else {
      const small = m.rects.filter(r => r.width < 44 || r.height < 44);
      say('tab bar'.padEnd(16) + m.btns.length + ' tabs at '
        + Math.round(m.rects[0].width) + '×' + Math.round(m.rects[0].height)
        + (small.length ? '  ' + small.length + ' UNDER THUMB SIZE' : '  ALL THUMB-SIZED'));
      /* A label that overflows its button is not a smaller tap target, it is an unreadable one — and
         overflow:hidden means it truncates silently rather than showing anything is wrong. */
      const clipped = m.btns.filter(b => b.scrollWidth > b.clientWidth + 1);
      say('tab labels'.padEnd(16) + (clipped.length
        ? clipped.map(b => b.textContent.trim()).join(',') + '  LABEL CLIPPED'
        : 'all ' + m.btns.length + ' fit'));

      /* ── and the same bar with EIGHT ──
         The Alliance tab only exists once you are online, so this probe runs a seven-tab bar and the
         widest case in the game goes unmeasured. Rather than reason about it, the grid is forced to
         eight columns and CSS does the arithmetic: 393/8 is 49px against a 44px thumb minimum and a
         label that was already at the width where "ALLIANCE" had to become "ALLY". Measured on a
         freshly-queried node for the reason above. */
      const was = m.bar.style.gridTemplateColumns;
      m.bar.style.gridTemplateColumns = 'repeat(8, 1fr)';
      const w8 = m.btns[0].getBoundingClientRect().width;
      const clip8 = m.btns.filter(b => b.scrollWidth > b.clientWidth + 1);
      say('tab bar at 8'.padEnd(16) + Math.round(w8) + 'px each'
        + (w8 > 0 && w8 < 44 ? '  UNDER THUMB SIZE' : '  THUMB-SIZED')
        + (clip8.length ? ' · ' + clip8.map(b => b.textContent.trim()).join(',') + '  LABEL CLIPPED'
                        : ' · all labels fit'));
      m.bar.style.gridTemplateColumns = was;
    }
    click('[data-act="tab"][data-key="hold"]');
    await wait(300);
  }

  /* ── the resource row has to stay on screen ──
     Reported with a screenshot: it was gone. Declared position:sticky, but html,body{overflow-x:hidden}
     made the root a scroll container and that breaks sticky on every descendant. Measured here rather
     than reasoned about, because "is it still visible after scrolling" is not a thing CSS will tell
     you and not a thing the stub DOM in verify-ui can answer. */
  {
    click('[data-act="tab"][data-key="hold"]');
    await wait(400);
    const before = d.querySelector('header')?.getBoundingClientRect();
    w.scrollTo(0, 600);
    await wait(500);
    const after = d.querySelector('header')?.getBoundingClientRect();
    const pinned = after && after.bottom > 0 && after.top < 200;
    say('resource row'.padEnd(16) + ' at ' + (before ? Math.round(before.top) : '?')
      + ' → after scrolling 600 it is at ' + (after ? Math.round(after.top) : 'GONE')
      + (pinned ? '  STILL ON SCREEN' : '  SCROLLED AWAY'));
    w.scrollTo(0, 0);
    await wait(300);
  }

  // ── and the page itself, which was never broken; here so a regression there would show
  {
    const over = d.documentElement.scrollHeight - w.innerHeight;
    if(over > 40){
      w.scrollTo(0, 300);
      const put = w.scrollY;
      await wait(800);
      say('the page'.padEnd(16) + ' overflow ' + over + 'px · put ' + Math.round(put)
        + ' → 800ms later ' + Math.round(w.scrollY)
        + (Math.abs(w.scrollY - put) < 4 ? '  KEPT' : '  LOST'));
    } else say('the page'.padEnd(16) + ' does not overflow');
  }
} catch (e) {
  say('THREW: ' + (e && e.message ? e.message : String(e)));
}
done();
</script>
</body></html>
