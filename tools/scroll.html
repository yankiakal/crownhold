<!-- Does a sheet stay where you scrolled it? `npm run scroll`
     Reported from play: "I can't scroll down on anything, for example the Codex, when I'm trying to
     gather the popup windows."

     The suspect is not CSS. The overlay layer and the card inside it both declare overflow-y:auto
     and always have. What the tick loop does is rewrite `fx.innerHTML` — the entire overlay layer,
     Codex and detail sheets included — every 250ms, which destroys and rebuilds those nodes four
     times a second, and a fresh element's scrollTop is 0. So a player drags a tall sheet and a
     quarter of a second later is holding a different element, sitting at the top.

     No unit test can see it: verify-ui renders against a stub DOM with no layout, no scrollHeight
     and no scrolling at all. It needs a real browser, a real overflowing sheet, and a real wait
     across at least one tick. The report is POSTed back to the harness server, on real time —
     `--virtual-time-budget` with `--dump-dom` hung on this page twice and passed once. -->
<!doctype html>
<html><head><meta charset="utf-8"><title>scroll probe</title>
<style>
  body{margin:0;background:#0d0b09;color:#d9a441;font:12px ui-monospace,monospace}
  pre{padding:10px;line-height:1.5;white-space:pre-wrap}
  iframe{border:1px solid #3a2f25;width:393px;height:852px;display:block}
  .rack{display:flex;gap:8px;padding:8px}
</style>
</head><body>
<div class="rack"><iframe id="f"></iframe></div>
<pre id="out">running…</pre>
<script type="module">
import { freshState, SAVE_KEY } from '../src/state.js';

function played(){
  const now = Date.now();
  const s = freshState(now, 11);
  Object.assign(s.b, { townhall:14, farm:15, lumberyard:14, quarry:12, ironmine:11,
    barracks:12, range:10, stable:9, siegeyard:8, wall:12, watchtower:6, tavern:8,
    granary:9, academy:12, hospital:8, warehouse:7, library:10, command:10, embassy:6 });
  s.tier = { spearman:4, archer:4, knight:3, ballista:3 };
  s.t = { spearman:260, archer:150, knight:70, ballista:35 };
  for(const id of ['marshal','gatekeeper','forager','steward','medic'])
    s.heroes[id] = { lvl:14, xp:120, stars:2, deeds:3, gear:{}, skills:[null,null,null] };
  s.court = ['steward','gatekeeper'];
  s.valor = 260; s.wave = 34; s.wavesWon = 33;
  /* Enough to actually build with. Seeded from freshState the purse is 500/500/250 against
     level-15 buildings, so every upgrade button rendered disabled and the badge probe reported
     "no buildable building" as though that were a finding about the game. */
  s.res = { food:9e5, wood:9e5, stone:9e5, iron:9e5, steel:9e5, runestone:9e5,
            rations:0, isleore:0, electrum:0 };
  s.seenIntro = true; s.offersDone = 12;
  s.choice = null; s.choiceQueue = [];
  s.taught = { upkeep:1, pace:1, cover:1, load:1 };
  s.now = now; s.lastSeen = now;
  return s;
}

const lines = [];
const out = document.getElementById('out');
const say = (t) => { lines.push(t); out.textContent = lines.join('\n'); };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const done = () => fetch('/report', { method:'POST', body: lines.join('\n') }).catch(() => {});

/* Anything that throws still has to report, or the harness waits out its whole deadline and says
   "nothing measured" when what actually happened was a TypeError on line four. */
window.addEventListener('error', (e) => { say('THREW: ' + e.message); done(); });

try {
  const save = played();
  localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  const f = document.getElementById('f');
  f.src = '../index.html';
  await new Promise(r => f.addEventListener('load', r, { once:true }));
  await wait(1500);

  const w = f.contentWindow, d = f.contentDocument;
  const click = (sel) => { const b = d.querySelector(sel); if(b){ b.click(); return true; } return false; };

  /* Scroll a surface, wait past two ticks of the 250ms loop, and see whether it stayed put.
     `node was replaced` is the diagnosis, not the assertion — it says WHY when it fails. */
  async function probe(name, open, find){
    if(!(await open())){ say(name.padEnd(16) + ' COULD NOT OPEN — nothing measured'); return; }
    await wait(500);
    const el = find();
    if(!el){ say(name.padEnd(16) + ' NO SCROLLER FOUND'); return; }
    const over = el.scrollHeight - el.clientHeight;
    if(over < 40){
      say(name.padEnd(16) + ' does not overflow (' + el.scrollHeight + ' in ' + el.clientHeight
        + ') — nothing to scroll');
      return;
    }
    el.scrollTop = Math.min(200, over);
    const put = el.scrollTop;
    await wait(800);
    const after = find();
    const now = after ? after.scrollTop : -1;
    say(name.padEnd(16) + ' overflow ' + over + 'px · put ' + Math.round(put)
      + ' → 800ms later ' + Math.round(now)
      + (Math.abs(now - put) < 4 ? '  KEPT' : '  LOST')
      + (after === el ? '' : '  (node was replaced)'));
  }

  // ── the Codex, opened from the footer. data-act="codex" toggles it, so the same click closes it.
  await probe('codex', async () => click('[data-act="codex"]'), () => d.querySelector('.card.codex'));
  click('[data-act="codex"]');
  await wait(400);
  say('codex closed'.padEnd(16) + (d.querySelector('.card.codex') ? ' NO — still open, the next probe would remeasure it' : ' yes'));

  /* ── a frontier tile sheet: the "when I'm trying to gather" half of the report.
     The map is a canvas, so there is no element to click — the coordinates have to be computed
     from a REAL tile. The first version of this dispatched a click at 20% across and hit empty
     ground, opened nothing, and then found the still-open Codex under `.overlay .card` and
     reported its scroll as the gather sheet's. Two rows, one measurement. */
  await probe('gather sheet', async () => {
    click('[data-act="tab"][data-key="world"]');
    await wait(400);
    const cv = d.getElementById('worldmap');
    if(!cv) return false;
    const MAP_W = 15, MAP_H = 9;
    /* The real type keys are woods / farmstead / quarry / ironvein. The first version of this
       looked for 'wood' and 'stone', matched nothing, and fell through to tiles[0]. */
    const tile = save.world.tiles.find(t => ['woods','farmstead','quarry','ironvein'].includes(t.type));
    if(!tile){ say('  (no gather tile in the seeded world)'); return false; }
    const r = cv.getBoundingClientRect();
    const cx = r.left + (tile.x + 0.5) / MAP_W * r.width;
    const cy = r.top  + (tile.y + 0.5) / MAP_H * r.height;
    /* pointerdown, not click. The canvas handler is bound to pointerdown — its own comment says
       "so the 4 Hz re-render can never swallow a click", which is this same bug seen from the
       other side. A dispatched 'click' reaches nothing and opens nothing. */
    cv.dispatchEvent(new w.MouseEvent('pointerdown', { bubbles:true, clientX: cx, clientY: cy }));
    await wait(400);
    if(!d.querySelector('.overlay'))
      say('  (clicked ' + tile.type + ' at ' + tile.x + ',' + tile.y + ' → ' + Math.round(cx) + ',' + Math.round(cy)
        + ' in a ' + Math.round(r.width) + '×' + Math.round(r.height) + ' canvas at ' + Math.round(r.left) + ',' + Math.round(r.top) + ' — no sheet)');
    return !!d.querySelector('.overlay');
  }, () => {
    const card = d.querySelector('.overlay .card');
    if(!card) return null;
    // whichever layer actually overflows is the one the player drags
    return (card.scrollHeight - card.clientHeight) > 40 ? card : d.querySelector('.overlay');
  });

  /* ── badges that sit on the buildings ──
     The WoS-style build timer floats over the building it belongs to, positioned by plotScreen —
     the exact inverse of the tap hit-test. Arithmetic like that cannot be checked by reading it:
     it needs a real canvas with a real bounding box, which is why it is measured here rather than
     in verify-ui, where every rect is a 360×360 stub.

     Lives in this file rather than a second Chrome harness because booting the game in a browser is
     the expensive part, and one probe that answers two questions beats two that each answer one. */
  {
    /* Close whatever the earlier probes left open FIRST. The gather sheet was still up, so the hold
       pane underneath had no layout, the scene slot measured 0×0, and the badge was placed against
       an origin of nothing — which looked like a positioning bug in the game and was a sequencing
       bug in the probe. */
    click('[data-act="detailClose"]');
    await wait(200);
    click('[data-act="tab"][data-key="hold"]');
    await wait(700);
    const before = d.querySelectorAll('.sbadge').length;
    // start a real build the way a player would: the action the buttons dispatch
    /* data-act="upgrade" — the name the buttons actually carry. "build" matched nothing, and the
       probe dutifully reported NO BUILDABLE BUILDING, which reads like a finding about the game. */
    const btn = Array.from(d.querySelectorAll('button[data-act="upgrade"]'))
      .find(b => !b.disabled);
    if(!btn){
      const all = d.querySelectorAll('button[data-act="upgrade"]');
      const q = d.querySelectorAll('.queue-strip').length;
      say('scene badge'.padEnd(16) + ' NO BUILDABLE BUILDING — ' + all.length + ' upgrade buttons, '
        + Array.from(all).filter(b => b.disabled).length + ' disabled, ' + q + ' queue strips already running');
    }
    else {
      btn.click();
      await wait(600);
      const badges = Array.from(d.querySelectorAll('.sbadge'));
      say('scene badge'.padEnd(16) + ' ' + before + ' → ' + badges.length + ' after starting a build'
        + (badges.length > before ? '  APPEARED' : '  MISSING'));
      if(badges.length){
        const b = badges[0].getBoundingClientRect();
        /* Re-queried HERE, not captured earlier. render() replaces app.innerHTML, so a reference
           taken before the build started points at a detached node whose rect is 0×0 — which the
           probe then reported as the badge being off the scene. The element was fine; the ruler
           had been thrown away. */
        /* Measured against the CANVAS, not the scroll viewport. The walls are wider than a phone, so
           the slot scrolls — a badge on a building currently scrolled out of view is correctly
           placed and outside the viewport, and comparing the two reported a real badge as
           misplaced. The canvas is the coordinate space plotScreen works in, so it is the one to
           check containment against. */
        const cvr = d.getElementById('holdscene')?.getBoundingClientRect() || null;
        const inside = cvr && b.left >= cvr.left - 30 && b.left <= cvr.right + 30
                           && b.top >= cvr.top - 30 && b.top <= cvr.bottom + 30;
        say('badge position'.padEnd(16) + ' ' + Math.round(b.left) + ',' + Math.round(b.top)
          + ' on walls at ' + (cvr ? Math.round(cvr.left) + ',' + Math.round(cvr.top)
              + ' ' + Math.round(cvr.width) + '×' + Math.round(cvr.height) : '?')
          + (inside ? '  ON THE WALLS' : '  OFF THE WALLS'));
        say('badge text'.padEnd(16) + ' "' + (badges[0].textContent || '').trim() + '"'
          + (/\d/.test(badges[0].textContent || '') ? '  COUNTS DOWN' : '  NO TIME SHOWN'));
        // and it has to be the way into that building
        badges[0].click();
        await wait(400);
        // v3.6: a badge raises the on-building POPUP now; the sheet moved behind its ⓘ
        say('badge opens it'.padEnd(16) + (d.querySelector('.bpeek, .overlay .card.dsheet') ? '  yes' : '  NO SHEET'));
        click('[data-act="peekClose"]'); click('[data-act="detailClose"]');
        await wait(300);
      }
    }
  }

  /* ── the resource row has to stay on screen ──
     Reported with a screenshot: it was gone. Declared position:sticky, but html,body{overflow-x:hidden}
     made the root a scroll container and that breaks sticky on every descendant. Measured here rather
     than reasoned about, because "is it still visible after scrolling" is not a thing CSS will tell
     you and not a thing the stub DOM in verify-ui can answer. */
  {
    click('[data-act="tab"][data-key="hold"]');
    await wait(400);
    const before = d.querySelector('header')?.getBoundingClientRect();
    w.scrollTo(0, 600);
    await wait(500);
    const after = d.querySelector('header')?.getBoundingClientRect();
    const pinned = after && after.bottom > 0 && after.top < 200;
    say('resource row'.padEnd(16) + ' at ' + (before ? Math.round(before.top) : '?')
      + ' → after scrolling 600 it is at ' + (after ? Math.round(after.top) : 'GONE')
      + (pinned ? '  STILL ON SCREEN' : '  SCROLLED AWAY'));
    w.scrollTo(0, 0);
    await wait(300);
  }

  // ── and the page itself, which was never broken; here so a regression there would show
  {
    const over = d.documentElement.scrollHeight - w.innerHeight;
    if(over > 40){
      w.scrollTo(0, 300);
      const put = w.scrollY;
      await wait(800);
      say('the page'.padEnd(16) + ' overflow ' + over + 'px · put ' + Math.round(put)
        + ' → 800ms later ' + Math.round(w.scrollY)
        + (Math.abs(w.scrollY - put) < 4 ? '  KEPT' : '  LOST'));
    } else say('the page'.padEnd(16) + ' does not overflow');
  }
} catch (e) {
  say('THREW: ' + (e && e.message ? e.message : String(e)));
}
done();
</script>
</body></html>
