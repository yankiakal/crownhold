<!-- Every tab of the game, at phone width, with a played-in hold. `npm run screens` shoots it.
     Served from a temp copy alongside dist/ so the iframes are same-origin.

     WHY THIS EXISTS. Every screenshot taken of this game so far has been the intro overlay
     covering everything behind it — so nobody has ever LOOKED at the Hold, War, Frontier,
     Court, Alliance or Ledger screens at the size they will be played at. Every visual bug
     this project has found was found by looking: hip roofs projecting as squat pyramids, trees
     buried under buildings, mud on unbuilt plots, name plates eating each other's words, the
     player's own hold missing from the frontier. None of them were findable any other way.

     It seeds a save into localStorage before the frame loads, which is the only way past the
     intro without a click — the game reads `crownhold-save-v1` on boot. The hold is
     deliberately mid-game: enough built that panels have content, not so much that everything
     is capped and the interesting states (a busy queue, a march out, wounded in the ward) are
     invisible. -->
<!doctype html>
<html><head><meta charset="utf-8"><title>every screen</title>
<style>
  body{margin:0;background:#0d0b09;color:#d9a441;font:11px ui-monospace,monospace}
  .rack{display:flex;gap:10px;padding:8px;align-items:flex-start;flex-wrap:nowrap}
  .dev h2{font:600 11px ui-monospace,monospace;letter-spacing:.1em;margin:0 0 3px;color:#9c8d77}
  iframe{border:1px solid #3a2f25;background:#171310;display:block}
</style>
</head><body>
<div class="rack" id="rack"></div>
<pre id="out" style="padding:8px"></pre>
<script type="module">
import { freshState, SAVE_KEY } from '../src/state.js';

/* A hold partway through: buildings raised but not capped, four troop types, a court, some
   wounded, Valor banked, a few waves survived. The point is that every panel has something in
   it — an empty panel looks fine and tells you nothing. */
function played(){
  const now = Date.now();
  const s = freshState(now, 11);
  Object.assign(s.b, { townhall:14, farm:15, lumberyard:14, quarry:12, ironmine:11,
    barracks:12, range:10, stable:9, siegeyard:8, wall:12, watchtower:6, tavern:8,
    granary:9, academy:12, hospital:8, warehouse:7, library:10, command:10, embassy:6 });
  s.tier = { spearman:4, archer:4, knight:3, ballista:3 };
  s.t = { spearman:260, archer:150, knight:70, ballista:35 };
  s.wounded = { spearman:18, archer:6 };
  for(const id of ['marshal','gatekeeper','forager','steward','medic'])
    s.heroes[id] = { lvl:14, xp:120, stars:2, deeds:3, gear:{}, skills:[null,null,null] };
  s.court = ['steward','gatekeeper'];
  s.captain = 'marshal';
  s.valor = 260; s.shields = 2; s.mxp = 900;
  s.wave = 34; s.wavesWon = 33; s.wavesLost = 7; s.warbandsWon = 2;
  s.spoils = { drill:2, larder:1, banner:1 };
  s.wallWear = 0.08;
  s.seenIntro = true;                    // the whole reason this file exists
  /* And no pending drafts. A hold seeded at Town Hall 14 with offersDone at 0 owes every hero
     milestone it never collected, so the first tick queues them all and "A DRAFT OF CHAMPIONS"
     covers every screen — which is what the first run of this harness photographed six times.
     Marking the offers already taken is what lets the game itself be visible. */
  s.offersDone = 12;
  s.choice = null; s.choiceQueue = [];
  s.taught = { upkeep:1, pace:1, cover:1, load:1 };   // past the holding lessons
  s.now = now; s.lastSeen = now;
  return s;
}

/* ?tabs=hold,war — a subset, so a rack of three can be shot at 2× and actually be readable.
   Six across at 1× is a contact sheet: it proves the layout fits and shows nothing about how it
   reads, which is the whole reason for looking. */
const ALL = ['hold','war','world','court','ally','ledger'];
const want = new URLSearchParams(location.search).get('tabs');
const TABS = want ? want.split(',').filter(t => ALL.includes(t)) : ALL;
const rack = document.getElementById('rack');
const frames = [];
for(const t of TABS){
  const box = document.createElement('div');
  box.className = 'dev';
  const h = document.createElement('h2');
  h.textContent = t.toUpperCase();
  const f = document.createElement('iframe');
  /* A REAL phone's height, not a tall capture frame. It was 1400px so the whole scrolling page
     would fit the screenshot — which silently broke every vh-based rule inside: the hold scene
     asks for 46vh and got 644px, sized for a screen no phone has, and the harness then reported
     it as "43% of the screen" against the 1400 rather than against a phone. Scroll depth is still
     measured via scrollHeight; it just is not all visible in one picture, which is exactly the
     player's situation too. */
  f.width = 393; f.height = 852;
  box.append(h, f);
  rack.appendChild(box);
  frames.push({ t, f });
}

/* Seed the save, then point each frame at the game. Each iframe gets its own document but
   shares the origin's localStorage, so one seed serves all six. */
localStorage.setItem(SAVE_KEY, JSON.stringify(played()));
for(const { f } of frames) f.src = '../index.html';

const rows = [];
setTimeout(() => {
  for(const { t, f } of frames){
    try {
      const w = f.contentWindow, d = w.document;
      // switch the frame to its tab by clicking the bar button, as a thumb would
      const btn = d.querySelector('[data-act="tab"][data-key="' + t + '"]');
      /* Say so when a tab is not in the bar. The Alliance tab only exists once you are online,
         and without this the click silently did nothing and the frame reported the HOLD pane's
         measurements under the ally label — a harness quietly measuring the wrong thing, which
         is the one failure this file was built to stop. */
      if(!btn){ rows.push(t + ': not in the bar (offline) — its panels fold into the Ledger'); continue; }
      btn.click();
      const doc = d.documentElement;
      /* How much of a phone screen is spent before any content: the header and the threat bar
         sit OUTSIDE the tabs, so whatever they cost is paid on all six. */
      const hd = d.querySelector('header'), th = d.querySelector('.threat');
      const chrome = (hd ? hd.getBoundingClientRect().height : 0)
                   + (th ? th.getBoundingClientRect().height : 0);
      rows.push('  chrome ' + Math.round(chrome) + 'px of ' + w.innerHeight + ' ('
        + Math.round(100*chrome/w.innerHeight) + '% of the first screen) — '
        + (hd ? Math.round(hd.getBoundingClientRect().height) : 0) + ' header + '
        + (th ? Math.round(th.getBoundingClientRect().height) : 0) + ' threat');
      if(t === 'hold'){
        /* How big the walls actually are. They were 255px tall at 393px wide — a third of the
           screen, an illustration rather than the subject the tab is named after. */
        const cv = d.getElementById('holdscene'), slot = d.getElementById('scene-slot');
        if(cv && slot){
          const r = cv.getBoundingClientRect();
          rows.push('  the walls ' + Math.round(r.width) + '×' + Math.round(r.height)
            + ' — ' + Math.round(100 * r.height / w.innerHeight) + '% of the screen'
            + (r.height / w.innerHeight >= 0.35 ? ' ✓ the subject' : ' ✗ too small to be the subject')
            + ' · slot ' + slot.clientWidth + '/' + slot.scrollWidth
            + (slot.scrollWidth > slot.clientWidth + 1 ? ' pans ✓'
               : (r.width > w.innerWidth + 1 ? ' ✗ CLIPPED — wider than the screen and cannot pan'
                                             : ' fits')));
        }
      }
      if(t === 'world'){
        const cv = d.getElementById('worldmap'), wrap = d.getElementById('mapwrap');
        if(cv && wrap){
          const cell = cv.getBoundingClientRect().width / 15;
          rows.push('  frontier cells ' + cell.toFixed(0) + 'px'
            + (cell >= 44 ? ' ✓ thumb-sized' : ' ✗ under the 44px a thumb can hit')
            + ' · map ' + Math.round(cv.getBoundingClientRect().width) + 'px in a '
            + Math.round(wrap.clientWidth) + 'px window'
            + (wrap.scrollWidth > wrap.clientWidth + 1 ? ' (scrolls)' : ' (fits)'));
        }
      }
      /* Measure the OPEN SHEET when there is one. Sheets are position:fixed, so they add
         nothing to documentElement.scrollHeight — after the base-view change every tab reported
         an identical 2.0 screens, which was the hold measured six times over. */
      /* The lesson card's share of the screen. It was ~430px of 852 — half the device, covering
         the walls on the Hold view — and a notification that owns half the screen is a modal
         wearing a corner. */
      if(t === 'hold'){
        /* The dock replaces a footer that was hidden on phones — including the version chip, which
           exists specifically so you can tell which build you are looking at. Losing it to a
           layout change would defeat the entire point of having added it. */
        const dock = d.querySelector('.dock');
        const btns = dock ? dock.querySelectorAll('button') : [];
        let small = 0;
        btns.forEach(b => { const r = b.getBoundingClientRect(); if(Math.min(r.width, r.height) < 44) small++; });
        /* Does the cluster sit on top of anything you need to press? In Whiteout Survival the
           world behind it has no controls; here the road panel has Raise buttons on the right
           edge, and the first version of this covered them.

           HORIZONTAL overlap only, deliberately. The first version of this check also required the
           rects to overlap VERTICALLY, which quietly restricted it to whatever happened to be on
           the first screen — and the dock is position:fixed, so it hangs in the same column at
           every scroll position. The Research panel's Study buttons sat directly under it and this
           check reported "buries nothing ✓", because those rows are 1,900px down. Any button whose
           x-range reaches into the dock's column WILL be buried once the player scrolls to it, so
           the x-range is the whole test. */
        let buried = 0, buriedWhat = [];
        if(dock){
          const dr = dock.getBoundingClientRect();
          /* Clip a button to whatever scroll container holds it before judging it. A horizontally
             scrolling strip — the research branch tabs, for one — legitimately has content beyond
             its own right edge, and getBoundingClientRect happily reports that off-screen position
             even though the container clips it and the player can never see it under the dock. The
             fourth branch tab tripped this the moment it existed. What matters is the VISIBLE
             rectangle, so intersect with every scrollable ancestor and test that. */
          const visibleRect = el => {
            let r = el.getBoundingClientRect();
            let n = el.parentElement;
            while(n && n !== d.body){
              const cs = f.contentWindow.getComputedStyle(n);
              if(/auto|scroll|hidden/.test(cs.overflowX + cs.overflowY)){
                const nr = n.getBoundingClientRect();
                const left = Math.max(r.left, nr.left), right = Math.min(r.right, nr.right);
                const top = Math.max(r.top, nr.top), bottom = Math.min(r.bottom, nr.bottom);
                if(right <= left || bottom <= top) return null;      // wholly clipped away
                r = { left, right, top, bottom, width: right - left, height: bottom - top };
              }
              n = n.parentElement;
            }
            return r;
          };
          d.querySelectorAll('button[data-act]').forEach(el => {
            if(el.closest('.dock') || el.closest('.tabbar') || el.closest('.card')) return;
            const r = visibleRect(el);
            if(r && r.width && r.right > dr.left && r.left < dr.right){
              buried++;
              if(buriedWhat.length < 4)
                buriedWhat.push((el.textContent || el.dataset.act || '?').trim().slice(0, 14));
            }
          });
        }
        rows.push('  dock ' + btns.length + ' icons'
          + (buried ? ' ✗ ' + buried + ' BUTTONS BURIED under it (' + buriedWhat.join(', ') + ')'
                    : ' · buries nothing ✓')
          + (small ? ' ✗ ' + small + ' under 44px' : ' ✓ all thumb-sized')
          + (dock && dock.querySelector('.vchip') ? ' · version chip present ✓' : ' ✗ NO VERSION VISIBLE')
          + (d.querySelector('footer') && d.querySelector('footer').offsetHeight
              ? ' ✗ footer still taking space' : ' · footer hidden ✓'));
      }
      /* Every tappable thing on this screen, against the 44px floor. The dock was audited and
         nothing else was — and "chunky buttons" is not a style, it is this number. */
      {
        const small = [];
        d.querySelectorAll('button, summary, [data-act]').forEach(el => {
          if(el.hasAttribute('data-act-bg')) return;              // a backdrop, not a target
          if(el.disabled) return;                                // cannot be pressed anyway
          const r = el.getBoundingClientRect();
          if(!r.width || !r.height) return;                      // not rendered
          if(Math.min(r.width, r.height) >= 44) return;
          const what = el.tagName.toLowerCase()
            + (el.className && typeof el.className === 'string' && el.className.trim()
                ? '.' + el.className.trim().split(/\s+/)[0] : '')
            + (el.dataset && el.dataset.act ? '[' + el.dataset.act + ']' : '');
          small.push(what + ' ' + Math.round(r.width) + '×' + Math.round(r.height));
        });
        const tally = {};
        for(const x of small){ const k = x.replace(/ \d+×\d+$/, ''); tally[k] = (tally[k]||0)+1; }
        const worst = Object.entries(tally).sort((a,b) => b[1]-a[1]).slice(0, 6);
        rows.push('  under 44px: ' + small.length + ' of '
          + d.querySelectorAll('button, summary, [data-act]').length
          + (small.length ? ' — ' + worst.map(([k,n]) => k + '×' + n).join(', ') : ' ✓'));
      }
      const les = d.querySelector('.lessondock .card.lesson') || d.querySelector('.card.lesson');
      if(les){
        const lh = les.getBoundingClientRect().height;
        rows.push('  lesson card ' + Math.round(lh) + 'px — '
          + Math.round(100*lh/w.innerHeight) + '% of the screen'
          + (lh / w.innerHeight <= 0.4 ? ' ✓' : ' ✗ OWNS THE SCREEN'));
      }
      const sheet = d.querySelector('.tabpane.sheet.on');
      /* The resource row must survive an open sheet. Covering it meant opening War hid what you
         have while you decide what to spend — and every game this borrows from keeps it visible
         above a modal. Checked by geometry, not by whether the element exists: it existed the
         whole time the sheet was sitting on top of it. */
      if(sheet){
        const hb = d.querySelector('header').getBoundingClientRect();
        const sb = sheet.getBoundingClientRect();
        rows.push('  resource row ' + (sb.top >= hb.bottom - 1
          ? 'stays visible above the sheet ✓' : '✗ COVERED by the sheet'));
      }
      const tall = sheet ? sheet.scrollHeight / w.innerHeight
                         : doc.scrollHeight / w.innerHeight;
      const wide = sheet ? sheet.scrollWidth : doc.scrollWidth;
      rows.push(t + ': ' + (sheet ? 'sheet' : 'base ') + ' width ' + wide + '/' + w.innerWidth
        + (wide > w.innerWidth + 1 ? ' ✗ OVERFLOWS' : ' ✓')
        + ' · ' + tall.toFixed(1) + ' screens'
        + (/undefined|NaN/.test(d.body.innerHTML) ? '  ✗ prints undefined/NaN' : ''));
    } catch(e){ rows.push(t + ': unreadable (' + e.name + ')'); }
  }
  document.getElementById('out').textContent = '@@SCREENS@@' + rows.join('\n') + '@@END@@';
  window.__done = true;
}, 3000);
</script>
</body></html>
